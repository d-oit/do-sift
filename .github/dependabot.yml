version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must track the pinned Node runtime; reviewed separately.
      - dependency-name: "@types/node"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
