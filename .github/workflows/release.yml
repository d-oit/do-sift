name: release

# Manual, exact-SHA release candidate flow (Plan 007 / prepare-release skill).
# Publishing is a separate approval-gated step; this workflow NEVER publishes.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Reviewed commit SHA on main to release"
        required: true
      version:
        description: "Version to release (must match CHANGELOG, e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: validate candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci
      - name: verify sha is on main
        run: git merge-base --is-ancestor "${{ inputs.sha }}" origin/main
      - name: verify version consistency
        run: npm run release:check
      - run: npm run check
      - run: npm run build
      - name: record candidate
        run: |
          echo "candidate: v${{ inputs.version }} @ ${{ inputs.sha }}" | tee candidate.txt
          git rev-parse HEAD >> candidate.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ inputs.version }}
          path: candidate.txt
          retention-days: 90

  # publish job intentionally absent: publication (tag, GHCR, npm) requires an
  # environment with reviewers where available, or the documented maintainer
  # publication ritual in docs/release.md. Do not add an unpinned publish job.
