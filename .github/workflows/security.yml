name: security

on:
  pull_request:
    branches: [main]
  schedule:
    # Weekly, off the hour to reduce load spikes.
    - cron: "17 3 * * 1"

permissions:
  contents: read

# CodeQL lives only in .github/workflows/codeql.yml. The `codeql` job that used
# to live here analyzed javascript-typescript a second time, and two
# configurations for one language produce duplicate alerts. This workflow keeps
# the dependency review and nothing else — see
# plans/016-ci-codeql-remediation.md (CI-03).
jobs:
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
