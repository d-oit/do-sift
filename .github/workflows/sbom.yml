name: sbom

# SBOM evidence for a release candidate (issue #164).
# Generates a deterministic CycloneDX document from the lockfile and uploads
# it. No registry credentials, no publishing, contents: read only.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - "**/package.json"

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: generate sbom (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: generate sbom
        run: npx tsx scripts/sbom.ts --out sbom.json
      - name: verify version policy
        run: npm run version:check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 90
