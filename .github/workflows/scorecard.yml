name: scorecard

# OpenSSF Scorecard: repository security posture. Runs on push to main and a
# weekly schedule (trusted events only; no privileged PR execution).
# publish_results stays false until the owner makes an explicit decision
# (requires id-token: write and a restricted workflow structure).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload only
      id-token: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30
      # SARIF upload to code scanning requires repository code-scanning
      # entitlement; if unavailable on this repo type, the artifact above is
      # the record and this step may be removed after FND verification.
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
