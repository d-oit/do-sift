name: scorecard

# OpenSSF Scorecard: repository security posture. Runs on push to main and a
# weekly schedule (trusted events only; no privileged PR execution).
# publish_results stays false until the owner makes an explicit decision
# (requires id-token: write and a restricted workflow structure).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload only
      id-token: none
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30
      # SARIF upload to code scanning requires repository code-scanning
      # entitlement; if unavailable on this repo type, the artifact above is
      # the record and this step may be removed after FND verification.
      - uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
