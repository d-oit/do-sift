name: scorecard

# OpenSSF Scorecard: repository security posture. Runs on push to main and a
# weekly schedule (trusted events only; no privileged PR execution).
# publish_results stays false until the owner makes an explicit decision
# (requires id-token: write and a restricted workflow structure).

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # SARIF upload only
      id-token: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30
      # SARIF upload to code scanning requires repository code-scanning
      # entitlement; if unavailable on this repo type, the artifact above is
      # the record and this step may be removed after FND verification.
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
